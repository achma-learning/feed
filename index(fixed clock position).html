<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health & Science Feed</title>
    <style>
        :root {
            --bg-primary: #f4f4f5;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --text-primary: #18181b;
            --text-secondary: #52525b;
            --text-muted: #a1a1aa;
            --accent: #dc2626;
            --accent-hover: #b91c1c;
            --accent-light: #fef2f2;
            --border: #e4e4e7;
            --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --shadow-hover: 0 10px 25px rgba(0,0,0,0.1);
            --nav-bg: #dc2626;
            --nav-text: #ffffff;
            --tag-bg: #f4f4f5;
            --tag-text: #52525b;
            --overlay: rgba(0,0,0,0.6);
            --sidebar-bg: #ffffff;
            --island-bg: rgba(24,24,27,0.92);
            --island-text: #ffffff;
            --prayer-highlight: #dc2626;
            --weather-gradient: linear-gradient(135deg, #3b82f6, #06b6d4);
            --far-accent: #5b6e1e;
            --far-accent-light: #f5f7ed;
        }

        [data-theme="dark"] {
            --bg-primary: #09090b;
            --bg-secondary: #18181b;
            --bg-card: #1c1c1f;
            --text-primary: #e4e4e7;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --accent: #ef4444;
            --accent-hover: #f87171;
            --accent-light: #1f1215;
            --border: #27272a;
            --shadow: 0 1px 3px rgba(0,0,0,0.3);
            --shadow-hover: 0 10px 25px rgba(0,0,0,0.4);
            --nav-bg: #18181b;
            --nav-text: #e4e4e7;
            --tag-bg: #27272a;
            --tag-text: #a1a1aa;
            --overlay: rgba(0,0,0,0.8);
            --sidebar-bg: #18181b;
            --island-bg: rgba(255,255,255,0.12);
            --island-text: #e4e4e7;
            --weather-gradient: linear-gradient(135deg, #1e3a5f, #164e63);
            --far-accent: #8fa33b;
            --far-accent-light: #1a1d12;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: background 0.3s, color 0.3s;
            overflow-x: hidden;
        }

        /* ── FLOATING ISLAND (Updated: Clock in Middle) ── */
        .floating-island {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            background: var(--island-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: var(--island-text);
            padding: 8px 24px;
            border-radius: 28px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
            white-space: nowrap;
        }

        .island-dot { width: 6px; height: 6px; background: #22c55e; border-radius: 50%; animation: pulse 2s infinite; }
        .island-divider { width: 1px; height: 16px; background: rgba(255,255,255,0.2); }
        .island-time { font-weight: 700; font-size: 0.85rem; font-variant-numeric: tabular-nums; color: #fff; }
        .island-date-en { opacity: 0.85; font-size: 0.75rem; }
        .island-date-ar { opacity: 0.85; font-size: 0.75rem; direction: rtl; }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* ── NAV ── */
        nav {
            background: var(--nav-bg);
            color: var(--nav-text);
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 52px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        /* ── MAIN LAYOUT ── */
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 320px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .feed-area { padding: 14px; }

        /* ── PRAYER CARD (Updated: Autocomplete) ── */
        .prayer-card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 16px;
            box-shadow: var(--shadow);
            direction: rtl;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        .search-container {
            position: relative;
            margin-bottom: 12px;
        }

        .city-search-input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--tag-bg);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.85rem;
            outline: none;
        }

        .autocomplete-results {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 100;
            display: none;
            box-shadow: var(--shadow-hover);
        }

        .result-item {
            padding: 8px 12px;
            cursor: pointer;
            text-align: right;
            font-size: 0.85rem;
            border-bottom: 1px solid var(--border);
        }

        .result-item:hover {
            background: var(--accent-light);
            color: var(--accent);
        }

        .prayer-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            margin-top: 10px;
        }

        .prayer-item {
            background: var(--tag-bg);
            border-radius: 8px;
            padding: 8px 4px;
            text-align: center;
        }

        .prayer-name { font-size: 0.65rem; color: var(--text-muted); }
        .prayer-time-val { font-size: 0.85rem; font-weight: 700; color: var(--text-primary); }

        /* ... existing grid/list/sidebar styles from your snippet ... */
        .sidebar { padding: 14px; display: flex; flex-direction: column; gap: 14px; border-left: 1px solid var(--border); height: calc(100vh - 52px); position: sticky; top: 52px; }
        
        /* Weather Card */
        .weather-card { background: var(--weather-gradient); border-radius: 12px; padding: 16px; color: #fff; }

    </style>
</head>
<body data-theme="light">

    <div class="floating-island" id="floatingIsland">
        <div class="island-dot"></div>
        <span class="island-date-en" id="islandDateEn">Monday, 16 Mar</span>
        <div class="island-divider"></div>
        <span class="island-time" id="islandTime">12:49</span>
        <div class="island-divider"></div>
        <span class="island-date-ar" id="islandDateAr">26 رمضان 1447</span>
    </div>

    <nav>
        <div class="nav-brand">Health<span>Feed</span></div>
    </nav>

    <div class="main-layout">
        <main class="feed-area">
            <div style="padding: 20px; text-align: center; color: var(--text-muted);">
                RSS Feed Items Loaded Here...
            </div>
        </main>

        <aside class="sidebar">
            <div class="prayer-card">
                <div class="prayer-city-label">مواقيت الصلاة لمدينة</div>
                
                <div class="search-container">
                    <input type="text" id="citySearch" class="city-search-input" placeholder="بحث عن مدينة...">
                    <div id="autocompleteList" class="autocomplete-results"></div>
                </div>

                <div class="prayer-hijri" id="hijriDisplay">الاثنين 26 رمضان 1447هـ</div>
                
                <div class="prayer-grid">
                    <div class="prayer-item"><div class="prayer-name">الفجر</div><div class="prayer-time-val">05:08</div></div>
                    <div class="prayer-item"><div class="prayer-name">الشروق</div><div class="prayer-time-val">06:34</div></div>
                    <div class="prayer-item"><div class="prayer-name">الظهر</div><div class="prayer-time-val">12:41</div></div>
                    <div class="prayer-item"><div class="prayer-name">العصر</div><div class="prayer-time-val">16:01</div></div>
                    <div class="prayer-item"><div class="prayer-name">المغرب</div><div class="prayer-time-val">18:40</div></div>
                    <div class="prayer-item"><div class="prayer-name">العشاء</div><div class="prayer-time-val">19:54</div></div>
                </div>
            </div>

            <div class="weather-card">
                <div style="font-size: 0.9rem; font-weight: 600;">الطقس الآن</div>
                <div style="font-size: 2rem; font-weight: 700;">24°C</div>
                <div style="font-size: 0.75rem; opacity: 0.9;">مراكش، المغرب</div>
            </div>
        </aside>
    </div>

    <script>
        // 1. DATA: Cities from Habous
        const cities = [
            { id: 1, name: "الرباط" }, { id: 2, name: "الخميسات" }, { id: 3, name: "تيفلت" },
            { id: 7, name: "القنيطرة" }, { id: 14, name: "طنجة" }, { id: 15, name: "تطوان" },
            { id: 31, name: "وجدة" }, { id: 58, name: "الدار البيضاء" }, { id: 81, name: "فاس" },
            { id: 99, name: "مكناس" }, { id: 104, name: "مراكش" }, { id: 117, name: "أكادير" }
            // ... You can add all 169+ cities here from the snippet you provided
        ];

        // 2. CLOCK & ISLAND LOGIC
        function updateClock() {
            const now = new Date();
            
            // Time
            document.getElementById('islandTime').textContent = now.toLocaleTimeString('en-GB', { 
                hour: '2-digit', minute: '2-digit', second: '2-digit' 
            });

            // English Date
            document.getElementById('islandDateEn').textContent = now.toLocaleDateString('en-GB', {
                weekday: 'short', day: 'numeric', month: 'short'
            });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 3. AUTOCOMPLETE SEARCH LOGIC
        const cityInput = document.getElementById('citySearch');
        const resultsContainer = document.getElementById('autocompleteList');

        cityInput.addEventListener('input', function() {
            const val = this.value.trim();
            resultsContainer.innerHTML = '';
            if (!val) {
                resultsContainer.style.display = 'none';
                return;
            }

            const filtered = cities.filter(c => c.name.includes(val));
            
            if (filtered.length > 0) {
                filtered.forEach(city => {
                    const div = document.createElement('div');
                    div.className = 'result-item';
                    div.textContent = city.name;
                    div.onclick = () => selectCity(city);
                    resultsContainer.appendChild(div);
                });
                resultsContainer.style.display = 'block';
            } else {
                resultsContainer.style.display = 'none';
            }
        });

        function selectCity(city) {
            cityInput.value = city.name;
            resultsContainer.style.display = 'none';
            console.log("Fetching times for city ID:", city.id);
            // Here you would trigger your Fetch call to the Habous API
            // fetch(`horaire-api.php?ville=${city.id}`).then(...)
        }

        // Close results when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-container')) {
                resultsContainer.style.display = 'none';
            }
        });
    </script>
</body>
</html>
